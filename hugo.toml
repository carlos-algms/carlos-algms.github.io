baseURL = "https://carlos-algms.github.io/"
title = "Carlos A. Gomes"
theme = "black-purple-2025"
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy"]

[params]
  gtag_id = "G-ZNQ41VTYXZ"

[languages]
  [languages.pt-br]
    weight = 1
    label = "Português"
    locale = "pt-BR"
    contentDir = "content"
    disabled = false
  [languages.en]
    weight = 2
    label = "English"
    locale = "en-US"
    disabled = true
  [languages.de]
    weight = 3
    label = "Deutsch"
    locale = "de-DE"
    disabled = true

[permalinks.page]
  blog = '/blog/:slug/'
  experiments = '/experiments/:slug/'

[taxonomies]
  tag = "tags"

[permalinks.taxonomy]
  tags = '/blog/tags/'

[permalinks.term]
  tags = '/blog/tags/:slug/'

[pagination]
  pagerSize = 5
  path = ""

[markup.goldmark.renderer]
  unsafe = true
