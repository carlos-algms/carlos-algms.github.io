name: Deploy Github Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail

          HUGO_VERSION="$(tr -d '[:space:]' < .hugo-version)"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          checksums="hugo_${HUGO_VERSION}_checksums.txt"
          base_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"

          curl -fsSLO "${base_url}/${archive}"
          curl -fsSLO "${base_url}/${checksums}"

          awk -v file="${archive}" '$2 == file { print $0 }' "${checksums}" \
            | sha256sum -c -

          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -C "${RUNNER_TEMP}/hugo" -xzf "${archive}"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

          "${RUNNER_TEMP}/hugo/hugo" version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUGO_BIN: ${{ runner.temp }}/hugo/hugo

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages # deploying branch
