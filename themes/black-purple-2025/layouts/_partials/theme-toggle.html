{{- /* Theme switcher UI: label + hidden checkbox + sliding sun/moon icons */ -}}
<div>
  <label class="inline-flex items-center cursor-pointer group" title="{{ i18n "toggle_theme_title" }}">
    <input type="checkbox" value="" class="sr-only" name="theme-selector">
    <span class="relative w-13 h-6 bg-blue-400 rounded-full dark:bg-gray-700 dark:group-has-checked:bg-blue-600">
      {{ partial "icon.html" (dict "name" "sun" "class" "absolute w-5 h-5 transition-opacity duration-300 z-10 translate-x-0 text-yellow-400 top-[2px] start-[4px] opacity-0 group-has-checked:opacity-100") }}
      <span aria-hidden="true" class="h-5 w-5 absolute top-[2px] start-[2px] z-20 bg-white border-gray-300 rounded-full transition-all group-has-checked:translate-x-7 dark:border-gray-600"></span>
      {{ partial "icon.html" (dict "name" "moon" "class" "absolute z-10 translate-x-7 w-5 h-5 transition-opacity duration-300 top-[2px] start-[0px] text-white opacity-100 group-has-checked:opacity-0") }}
    </span>
  </label>
</div>
