<title>
{{- if eq .Kind "home" -}}
  Carlos A. Gomes
{{- else if .Title -}}
  {{- $title := .Title -}}
  {{- if or (eq .Kind "section") (eq .Kind "term") (eq .Kind "taxonomy") -}}
    {{- with .Paginator -}}
      {{- if gt .PageNumber 1 -}}
        {{- $title = printf "%s - %s %d" $title (i18n "page") .PageNumber -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{ $title }} | Carlos A. Gomes
{{- else -}}
  Carlos A. Gomes
{{- end -}}
</title>

<script>
  partytown = {
    forward: ['dataLayer.push', 'gtag'],
  };
</script>
<script src="/~partytown/partytown.js"></script>

<script type="text/partytown" async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.gtag_id }}"></script>

<script type="text/partytown">
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    dataLayer.push(arguments);
  }

  gtag('js', new Date());

  // Initialize as Anonymous until we have a proper consent management
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
  });

  gtag('config', '{{ site.Params.gtag_id }}');
</script>

<script data-category="analytics">
  function updateConsents() {
    if (typeof gtag !== 'function') {
      console.warn('gtag is not defined');
      return;
    }

    gtag('consent', 'update', {
      ad_storage: 'granted',
      ad_user_data: 'granted',
      ad_personalization: 'granted',
      analytics_storage: 'granted',
    });
  }
</script>
